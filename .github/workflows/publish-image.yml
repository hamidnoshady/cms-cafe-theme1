name: Publish image

# Builds the theme image and pushes it to GHCR, then registers the pushed digest with
# Eshobe CMS. Registering is what makes the image deployable: the CMS never looks at
# GHCR, it only deploys a `theme-artifacts` row for the exact commit
# (docs/theme-artifacts.md in eshobe-cms).
#
# Runs on every merge to `main` (that is what the CMS deploys from), on `v*` tags, and
# by hand. The gate is `ci.yml`, so an image is never published from a red commit.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the selected branch or tag)
        required: false
        type: string

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, push to GHCR, register
    needs: ci
    runs-on: ubuntu-latest
    env:
      # These are repository secrets. The CMS URL is its admin/control-plane origin,
      # never a customer storefront domain. Registration fails if any value is absent:
      # an unregistered image is not deployable.
      ESHOBE_CMS_URL: ${{ secrets.ESHOBE_CMS_URL }}
      ESHOBE_THEME_PACKAGE_ID: ${{ secrets.ESHOBE_THEME_PACKAGE_ID }}
      ESHOBE_THEME_ARTIFACT_SECRET: ${{ secrets.ESHOBE_THEME_ARTIFACT_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Read the immutable image identity and commit
        # Keep CI and the manifest identical. Coolify deploys this repository by digest,
        # not by any mutable tag.
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          manifest_image="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('eshobe.theme.json', 'utf8')).deployment.registryImageRepository)")"
          if [ "$manifest_image" != "$image" ]; then
            echo "::error::Manifest image $manifest_image does not match CI image $image"
            exit 1
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        name: Compute image tags and OCI labels
        # Compute tags and OCI labels locally from git + workflow context so publishing
        # never fails on transient api.github.com DNS errors inside docker/metadata-action.
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ steps.image.outputs.commit }}
        run: |
          node -e '
            const fs = require("node:fs");
            const image = process.env.IMAGE;
            const commit = process.env.COMMIT;
            const shortSha = commit.slice(0, 7);
            const ref = process.env.GITHUB_REF || "";
            const eventName = process.env.GITHUB_EVENT_NAME || "";
            const repo = process.env.GITHUB_REPOSITORY || "";
            const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
            const repoName = repo.split("/")[1] || repo;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

            const tagSet = new Set();
            const semverMatch = /^refs\/tags\/v?(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$/.exec(ref);
            let versionLabel = `sha-${shortSha}`;
            if (semverMatch) {
              const [, major, minor, patch, pre = ""] = semverMatch;
              const fullVer = `${major}.${minor}.${patch}${pre}`;
              tagSet.add(`${image}:${fullVer}`);
              if (!pre) tagSet.add(`${image}:${major}.${minor}`);
              versionLabel = fullVer;
            }
            tagSet.add(`${image}:sha-${shortSha}`);
            tagSet.add(`${image}:${commit}`);
            if (ref === "refs/heads/main") tagSet.add(`${image}:latest`);
            if (eventName === "workflow_dispatch") tagSet.add(`${image}:edge`);

            const tags = [...tagSet];
            const labels = [
              `org.opencontainers.image.title=${repoName}`,
              `org.opencontainers.image.description=${pkg.description || ""}`,
              `org.opencontainers.image.source=${serverUrl}/${repo}`,
              `org.opencontainers.image.url=${serverUrl}/${repo}`,
              `org.opencontainers.image.revision=${commit}`,
              `org.opencontainers.image.created=${new Date().toISOString()}`,
              `org.opencontainers.image.version=${versionLabel}`,
            ];

            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `tags<<EOF_TAGS\n${tags.join("\n")}\nEOF_TAGS\n`);
            fs.appendFileSync(out, `labels<<EOF_LABELS\n${labels.join("\n")}\nEOF_LABELS\n`);
            console.log("Tags:\n" + tags.join("\n"));
            console.log("Labels:\n" + labels.join("\n"));
          '
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - name: Verify the pushed digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ steps.image.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          served="$(docker buildx imagetools inspect "$IMAGE:$COMMIT" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ "$served" != "$DIGEST" ]; then
            echo "GHCR serves $served for $IMAGE:$COMMIT, expected $DIGEST" >&2
            exit 1
          fi
      - name: Register the artifact with Eshobe CMS
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ steps.image.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${ESHOBE_CMS_URL:-}" ] || [ -z "${ESHOBE_THEME_PACKAGE_ID:-}" ] || [ -z "${ESHOBE_THEME_ARTIFACT_SECRET:-}" ]; then
            echo '::error::Image pushed but NOT registered: add repository secrets ESHOBE_CMS_URL, ESHOBE_THEME_PACKAGE_ID and ESHOBE_THEME_ARTIFACT_SECRET.'
            exit 1
          fi
          # Build this compact JSON string once. Its exact UTF-8 bytes are the bytes
          # HMAC-signed and the bytes curl sends -- never parse/re-encode it in between.
          body="$(jq -c -n \
            --arg repository "${GITHUB_REPOSITORY,,}" \
            --arg ref "$REF_NAME" \
            --arg commit "$COMMIT" \
            --arg image "$IMAGE" \
            --arg tag "$COMMIT" \
            --arg digest "$DIGEST" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{repository:$repository, ref:$ref, commit:$commit, registry:"ghcr", image:$image, tag:$tag, digest:$digest, workflowRunId:$runId, workflowRunUrl:$runUrl, platform:"linux/amd64"}')"
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$ESHOBE_THEME_ARTIFACT_SECRET" -hex | sed 's/^.* //')"
          response_file="$(mktemp)"
          status="$(curl -sS --retry 3 --retry-all-errors \
            -o "$response_file" -w '%{http_code}' \
            -X POST "${ESHOBE_CMS_URL%/}/api/platform/theme-packages/${ESHOBE_THEME_PACKAGE_ID}/artifacts" \
            -H 'Content-Type: application/json' \
            -H "X-Eshobe-Signature-256: $sig" \
            --data-binary "$body")"
          case "$status" in
            200|201) cat "$response_file" ;;
            *)
              echo "::error::Artifact registration returned HTTP $status" >&2
              cat "$response_file" >&2 || true
              exit 1
              ;;
          esac
      - name: Job summary
        env:
          COMMIT: ${{ steps.image.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Image published'
            echo
            echo "commit: \`$COMMIT\`"
            echo "digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
